# Cloudflare Pages + Functions + D1 config for Tomatonater.
# See README.md for the one-time setup commands.

name = "tomatonater"
compatibility_date = "2024-09-25"
pages_build_output_dir = "public"

# The D1 database binding. `wrangler d1 create tomatonater` prints a
# database_id — paste it below (and set the same binding in the Pages
# dashboard: Settings -> Functions -> D1 database bindings).
[[d1_databases]]
binding = "DB"
database_name = "tomatonater"
database_id = "3479ebec-6962-4130-936e-f7f11f1691f6"
