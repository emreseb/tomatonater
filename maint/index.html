<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tomatonater — back soon</title>
<meta name="description" content="Tomatonater is down for a quick privacy tune-up. Back shortly." />
<meta name="theme-color" content="#1B3A2A" />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{ --garden:#1B3A2A; --cream:#FBF4E2; --cream-dim:#C3D2B7; --tomato:#EA3B22; --tomato-3:#8F1E0E; --butter:#F5CE63; --crate:#2A5638; --crate-edge:#16311F; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 90% at 50% -10%, #24512F 0%, var(--garden) 55%, #14301F 100%);
    color:var(--cream); font-family:"Nunito",system-ui,sans-serif; font-weight:700;
    min-height:100%; display:flex; align-items:center; justify-content:center; padding:1.5rem; text-align:center;
  }
  .card{
    max-width:26rem; background:linear-gradient(180deg,var(--crate),#245030);
    border:.2rem solid var(--crate-edge); border-radius:1.1rem; padding:2rem 1.6rem;
    box-shadow:0 .5rem 0 rgba(0,0,0,.28);
  }
  .tomato{font-size:3.4rem; line-height:1; margin-bottom:.4rem; display:inline-block; animation:spin 3.5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .tomato{animation:none} }
  h1{font-family:"Fredoka",sans-serif; font-weight:700; font-size:1.9rem; margin:.2rem 0 .1rem; color:var(--butter)}
  p{color:var(--cream-dim); line-height:1.55; margin:.7rem 0 0}
  .tag{display:inline-block; margin-top:1.1rem; font-family:"Fredoka",sans-serif; font-weight:600; font-size:.85rem;
    color:var(--cream); background:rgba(20,48,31,.6); border:.12rem solid var(--crate-edge); padding:.4rem .8rem; border-radius:.6rem}
</style>
</head>
<body>
  <div class="card">
    <div class="tomato">🍅</div>
    <h1>Back in a bit</h1>
    <p>Tomatonater is paused for a quick privacy tune-up — we're making sure your location stays yours.</p>
    <p>Check back soon and the duel will be on again.</p>
    <div class="tag">Under maintenance</div>
  </div>
</body>
</html>
